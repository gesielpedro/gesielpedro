<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema CRUD</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

header{
    background:#4f46e5;
    color:white;
    padding:30px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.menu{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.menu button{
    flex:1;
    min-width:150px;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    color:white;
    transition:.3s;
}

.btn-criar{
    background:#4f46e5;
}

.btn-listar{
    background:#0ea5e9;
}

.btn-editar{
    background:#f59e0b;
}

.btn-excluir{
    background:#ef4444;
}

.menu button:hover{
    transform:translateY(-3px);
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:none;
    height:120px;
}

.salvar{
    margin-top:15px;
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.post{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.acoes{
    margin-top:10px;
}

.acoes button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:white;
    margin-right:5px;
}

.editar{
    background:#f59e0b;
}

.excluir{
    background:#ef4444;
}

</style>
</head>

<body>

<header>
    <h1>🚀 Sistema CRUD</h1>
    <p>Gerenciamento de Posts</p>
</header>

<div class="container">

    <div class="menu">

        <button class="btn-criar" onclick="mostrarFormulario()">
            ➕ Criar Post
        </button>

        <button class="btn-listar" onclick="carregarPosts()">
            📋 Listar Posts
        </button>

    </div>

    <div class="card" id="formulario">

        <h2>Novo Post</h2>

        <input id="title" placeholder="Título">

        <textarea id="content" placeholder="Conteúdo"></textarea>

        <button class="salvar" onclick="salvarPost()">
            💾 Salvar
        </button>

    </div>

    <div id="posts"></div>

</div>

<script>

const API = "https://meu-backend-yx68.onrender.com/posts";

let editandoId = null;

// MOSTRAR FORMULÁRIO
function mostrarFormulario(){
    document.getElementById("formulario").style.display = "block";
}

// CARREGAR POSTS
async function carregarPosts(){

    const res = await fetch(API);

    const posts = await res.json();

    const div = document.getElementById("posts");

    div.innerHTML = "";

    posts.reverse().forEach(post => {

        div.innerHTML += `
        
        <div class="post">

            <h3>${post.title}</h3>

            <p>${post.content}</p>

            <div class="acoes">

                <button class="editar"
                    onclick="editarPost(${post.id},
                    \`${post.title}\`,
                    \`${post.content}\`)">

                    ✏️ Editar
                </button>

                <button class="excluir"
                    onclick="excluirPost(${post.id})">

                    🗑️ Excluir
                </button>

            </div>

        </div>
        
        `;
    });
}

// SALVAR
async function salvarPost(){

    const title = document.getElementById("title").value;

    const content = document.getElementById("content").value;

    // EDITAR
    if(editandoId){

        await fetch(`${API}/${editandoId}`,{
            method:"PUT",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                title,
                content
            })
        });

        editandoId = null;

    }else{

        // CRIAR
        await fetch(API,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                title,
                content
            })
        });

    }

    limparFormulario();

    carregarPosts();
}

// EDITAR
function editarPost(id,title,content){

    document.getElementById("title").value = title;

    document.getElementById("content").value = content;

    editandoId = id;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

// EXCLUIR
async function excluirPost(id){

    if(confirm("Deseja excluir este post?")){

        await fetch(`${API}/${id}`,{
            method:"DELETE"
        });

        carregarPosts();
    }
}

// LIMPAR
function limparFormulario(){

    document.getElementById("title").value = "";

    document.getElementById("content").value = "";
}

// INICIAR
carregarPosts();

</script>

</body>
</html>
