<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Posts</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  margin-top: 10px;
  padding: 10px;
  background: #4f46e5;
  color: white;
  border: none;
  cursor: pointer;
}

.card {
  background: white;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🚀 Sistema de Posts</h1>

  <input id="title" placeholder="Título">
  <textarea id="content" placeholder="Conteúdo"></textarea>

  <button onclick="criarPost()">Salvar</button>

  <div id="posts"></div>
</div>

<script>
const API = "https://meu-backend-yx68.onrender.com/posts";

async function carregarPosts() {
  const res = await fetch(API);
  const data = await res.json();

  const div = document.getElementById("posts");
  div.innerHTML = "";

  data.forEach(post => {
    div.innerHTML += `
      <div class="card">
        <h3>${post.title}</h3>
        <p>${post.content}</p>
      </div>
    `;
  });
}

async function criarPost() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  const resposta = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      title,
      content
    })
  });

  console.log(await resposta.json());

  carregarPosts();
}

carregarPosts();
</script>

</body>
</html>
