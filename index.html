<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Posts</title>

<style>
body { font-family: Arial; background: #f4f6f9; }
.container { max-width: 800px; margin: auto; }
input, textarea {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
}
button {
  background: #4f46e5;
  color: white;
  border: none;
  padding: 10px;
}
.card {
  background: white;
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>📌 Sistema de Posts</h1>

  <input id="title" placeholder="Título">
  <textarea id="content" placeholder="Conteúdo"></textarea>
  <button onclick="criarPost()">Salvar</button>

  <h2>Posts</h2>
  <div id="lista"></div>
</div>

<script>
const API = "http://localhost:3000/posts";

async function carregarPosts() {
  const res = await fetch(API);
  const posts = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  posts.forEach(p => {
    lista.innerHTML += `
      <div class="card">
        <h3>${p.title}</h3>
        <p>${p.content}</p>
      </div>
    `;
  });
}

async function criarPost() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, content })
  });

  carregarPosts();
}

carregarPosts();
</script>

</body>
</html>
